name: RentItEase - Release E2E / RC1

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # All refs share production E2E accounts and data. Serialize runs to avoid
  # pull-request and main workflows mutating the same records concurrently.
  group: rentitease-production-release-e2e
  cancel-in-progress: false

jobs:

  # ============================================================
  # BACKEND BUILD
  # ============================================================

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint backend
        run: npm run lint

      - name: Backend unit tests
        run: npm run test:unit:properties

      - name: Build backend
        run: npm run build


  # ============================================================
  # REMOTE BACKEND RELEASE E2E
  # ============================================================

  remote-e2e:
    name: Tenant / Owner / Admin Remote E2E
    needs: backend-build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Remote Railway backend
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_API_PREFIX: /api/v1

      # Tenant
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}

      # Owner
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}

      # Admin
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      # Shared release test property used by legacy suites.
      E2E_PROPERTY_ID: ${{ secrets.E2E_PROPERTY_ID }}

      # Optional integrations
      E2E_RAZORPAY_KEY_SECRET: ${{ secrets.E2E_RAZORPAY_KEY_SECRET }}

      # Strict release configuration validation
      E2E_STRICT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Verify release E2E configuration
        run: |
          test -n "$E2E_BASE_URL" && echo "E2E_BASE_URL: configured" || (echo "E2E_BASE_URL: MISSING" && exit 1)
          test -n "$E2E_API_PREFIX" && echo "E2E_API_PREFIX: configured" || (echo "E2E_API_PREFIX: MISSING" && exit 1)
          test -n "$E2E_TENANT_EMAIL" && echo "E2E_TENANT_EMAIL: configured" || (echo "E2E_TENANT_EMAIL: MISSING" && exit 1)
          test -n "$E2E_TENANT_PASSWORD" && echo "E2E_TENANT_PASSWORD: configured" || (echo "E2E_TENANT_PASSWORD: MISSING" && exit 1)
          test -n "$E2E_OWNER_EMAIL" && echo "E2E_OWNER_EMAIL: configured" || (echo "E2E_OWNER_EMAIL: MISSING" && exit 1)
          test -n "$E2E_OWNER_PASSWORD" && echo "E2E_OWNER_PASSWORD: configured" || (echo "E2E_OWNER_PASSWORD: MISSING" && exit 1)
          test -n "$E2E_ADMIN_EMAIL" && echo "E2E_ADMIN_EMAIL: configured" || (echo "E2E_ADMIN_EMAIL: MISSING" && exit 1)
          test -n "$E2E_ADMIN_PASSWORD" && echo "E2E_ADMIN_PASSWORD: configured" || (echo "E2E_ADMIN_PASSWORD: MISSING" && exit 1)
          test -n "$E2E_PROPERTY_ID" && echo "E2E_PROPERTY_ID: configured" || (echo "E2E_PROPERTY_ID: MISSING" && exit 1)

      - name: Wait for production deployment to stabilize
        run: |
          sleep 60
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors "https://api.rentitease.com/api/v1/health"

      - name: Release E2E suite except property visits
        run: |
          npx jest \
            --config test/jest-release-e2e.json \
            --runInBand \
            --verbose \
            --testPathIgnorePatterns=property-visits.e2e-spec.ts

      - name: Create isolated property-visit fixture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const baseUrl = process.env.E2E_BASE_URL;
          const apiPrefix = process.env.E2E_API_PREFIX || '/api/v1';
          const apiUrl = `${baseUrl}${apiPrefix}`;

          function unwrap(body) {
            let current = body;
            for (let i = 0; i < 5; i += 1) {
              if (current && typeof current === 'object' && !Array.isArray(current) && current.data !== undefined) {
                current = current.data;
              } else {
                break;
              }
            }
            return current;
          }

          function tokenFrom(body) {
            return body?.accessToken || body?.data?.accessToken || body?.data?.data?.accessToken || body?.token || body?.data?.token;
          }

          async function main() {
            const loginResponse = await fetch(`${apiUrl}/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                login: process.env.E2E_OWNER_EMAIL,
                password: process.env.E2E_OWNER_PASSWORD,
              }),
            });

            const loginBody = await loginResponse.json();
            if (!loginResponse.ok) {
              throw new Error(`Owner login failed (${loginResponse.status}): ${JSON.stringify(loginBody)}`);
            }

            const token = tokenFrom(loginBody);
            if (!token) {
              throw new Error('Unable to extract owner access token for property-visit fixture.');
            }

            const createResponse = await fetch(`${apiUrl}/properties`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                title: `Property Visit CI Fixture ${Date.now()}`,
                description: 'Fresh property created for the isolated property visit release test.',
                price: 25000,
                address: '123 Property Visit CI Road',
                locality: 'HSR Layout',
                landmark: 'Near CI Junction',
                city: 'Bangalore',
                state: 'Karnataka',
                country: 'India',
                pincode: '560102',
                latitude: 12.9116,
                longitude: 77.6474,
                bedrooms: 2,
                bathrooms: 2,
                area: 1200,
                propertyType: 'APARTMENT',
                furnishing: 'SEMI_FURNISHED',
                parking: true,
                petFriendly: true,
                securityDeposit: 50000,
              }),
            });

            const createBody = await createResponse.json();
            if (!createResponse.ok) {
              throw new Error(`Property fixture creation failed (${createResponse.status}): ${JSON.stringify(createBody)}`);
            }

            const property = unwrap(createBody);
            const propertyId = property?.property?.id || property?.id;
            if (!propertyId) {
              throw new Error(`Unable to extract property fixture ID: ${JSON.stringify(createBody)}`);
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `E2E_VISIT_PROPERTY_ID=${propertyId}\n`);
            console.log('Fresh property-visit fixture created successfully.');
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Property Visits E2E with isolated fixture
        run: |
          E2E_PROPERTY_ID="$E2E_VISIT_PROPERTY_ID" \
            npx jest \
              --config test/jest-release-e2e.json \
              --runInBand \
              --verbose \
              test/release/property-visits.e2e-spec.ts


  # ============================================================
  # SECURITY AUDIT
  # ============================================================

  security-audit:
    name: Security / Configuration Audit
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          chmod +x scripts/security-audit.sh
          ./scripts/security-audit.sh


  # ============================================================
  # FLUTTER ANALYZE + TEST
  # ============================================================

  flutter:
    name: Flutter Analyze + Integration
    needs: remote-e2e
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Tenant / Owner integration tests
        run: flutter test test/integration/p0_chat_flow_test.dart


  # ============================================================
  # FLUTTER WEB RELEASE BUILD
  # ============================================================

  flutter-web:
    name: Flutter Web Release
    needs: remote-e2e
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --dart-define=API_BASE_URL=${{ secrets.E2E_BASE_URL }}/api/v1

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rentitease-web
          path: mobile_app/build/web


  # ============================================================
  # ANDROID RELEASE CANDIDATE
  # ============================================================

  android-release:
    name: Android Release Candidate Build
    needs: [remote-e2e, security-audit]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
          } > android/key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=${{ secrets.E2E_BASE_URL }}/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rentitease-android-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk


  # ============================================================
  # RELEASE CANDIDATE 1 GATE
  # ============================================================

  rc1:
    name: Release Candidate 1 Gate

    needs:
      [
        backend-build,
        remote-e2e,
        security-audit,
        flutter,
        flutter-web,
        android-release
      ]

    runs-on: ubuntu-latest

    steps:
      - name: RC1 passed
        run: |
          echo "=============================================="
          echo " RentItEase Release Candidate 1"
          echo "=============================================="
          echo "Backend build: PASS"
          echo "Tenant / Owner / Admin Remote E2E: PASS"
          echo "Security audit: PASS"
          echo "Flutter checks: PASS"
          echo "Flutter Web build: PASS"
          echo "Android release build: PASS"
          echo "=============================================="
          echo " RentItEase RC1 RELEASE GATE PASSED"
          echo "=============================================="
