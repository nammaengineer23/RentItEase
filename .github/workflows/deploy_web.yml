name: Deploy RentItEase Web

on:
  workflow_run:
    workflows: ["RentItEase - Release E2E / RC1"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: rentitease-production-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Flutter Web to Cloudflare
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Setup Node.js for React admin
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json

      - name: Build React admin panel
        working-directory: admin_panel
        env:
          VITE_API_BASE_URL: https://api.rentitease.com/api/v1
        run: |
          npm ci
          npm run build

      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Validate Cloudflare SEO routes
        run: node scripts/test-worker-seo.mjs

      - name: Build production web
        working-directory: mobile_app
        env:
          FACEBOOK_PAGE_URL: ${{ vars.FACEBOOK_PAGE_URL }}
          INSTAGRAM_PROFILE_URL: ${{ vars.INSTAGRAM_PROFILE_URL }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
          GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_WEB_API_KEY" || {
            echo "GOOGLE_MAPS_WEB_API_KEY is required for the web location picker."
            exit 1
          }
          # Flutter's google_maps_flutter_web expects the Google Maps JS API
          # to be present in index.html. Load it explicitly with the same key
          # used by geocoding so map tiles and the location picker work on web.
          sed -i "/<script src=\"flutter_bootstrap.js\" async><\\/script>/i\\  <script src=\"https://maps.googleapis.com/maps/api/js?key=$GOOGLE_MAPS_WEB_API_KEY\"></script>" web/index.html
          grep -q "maps.googleapis.com/maps/api/js?key=" web/index.html || {
            echo "Google Maps JavaScript API injection failed."
            exit 1
          }

          flutter build web \
            --release \
            --dart-define=API_BASE_URL=https://api.rentitease.com/api/v1 \
            --dart-define=MAPS_API_KEY="$GOOGLE_MAPS_WEB_API_KEY" \
            --dart-define=FACEBOOK_PAGE_URL="$FACEBOOK_PAGE_URL" \
            --dart-define=INSTAGRAM_PROFILE_URL="$INSTAGRAM_PROFILE_URL" \
            --dart-define=YOUTUBE_CHANNEL_URL="$YOUTUBE_CHANNEL_URL"

          rm -rf build/web/admin-panel
          mkdir -p build/web/admin-panel
          cp -R ../admin_panel/dist/. build/web/admin-panel/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          FACEBOOK_PAGE_URL: ${{ vars.FACEBOOK_PAGE_URL }}
          INSTAGRAM_PROFILE_URL: ${{ vars.INSTAGRAM_PROFILE_URL }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
        run: |
          worker_vars=()
          if [ -n "$GA_MEASUREMENT_ID" ]; then worker_vars+=(--var "GA_MEASUREMENT_ID:$GA_MEASUREMENT_ID"); fi
          if [ -n "$FACEBOOK_PAGE_URL" ]; then worker_vars+=(--var "FACEBOOK_PAGE_URL:$FACEBOOK_PAGE_URL"); fi
          if [ -n "$INSTAGRAM_PROFILE_URL" ]; then worker_vars+=(--var "INSTAGRAM_PROFILE_URL:$INSTAGRAM_PROFILE_URL"); fi
          if [ -n "$YOUTUBE_CHANNEL_URL" ]; then worker_vars+=(--var "YOUTUBE_CHANNEL_URL:$YOUTUBE_CHANNEL_URL"); fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc "${worker_vars[@]}"
