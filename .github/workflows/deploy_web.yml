name: Deploy RentItEase Web

on:
  workflow_run:
    workflows: ["RentItEase - Release E2E / RC1"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: rentitease-production-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Flutter Web to Cloudflare
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build production web
        working-directory: mobile_app
        run: |
          flutter build web \
            --release \
            --dart-define=API_BASE_URL=https://api.rentitease.com/api/v1

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
