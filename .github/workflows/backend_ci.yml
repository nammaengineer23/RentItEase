name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/rentitease
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build Backend
        run: npm run build

      - name: Full Unit Test Suite
        run: npm test

      - name: Security / configuration audit
        working-directory: .
        run: |
          chmod +x scripts/security-audit.sh
          ./scripts/security-audit.sh


  database-audit:
    name: Prisma / Database Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: rentitease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d rentitease"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/rentitease

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Audit migration history and required constraints
        working-directory: .
        run: |
          chmod +x scripts/prisma-database-audit.sh
          ./scripts/prisma-database-audit.sh

      - name: Apply complete migration history to a fresh PostgreSQL database
        run: npx prisma migrate deploy

      - name: Verify migration history has no drift or failed migrations
        run: npx prisma migrate status

      - name: Verify live database matches Prisma schema
        run: npx prisma migrate diff --exit-code --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma

      - name: Exercise schema with production-like rows
        run: |
          psql "$DATABASE_URL" <<'SQL'
          INSERT INTO "User" ("id","fullName","email","passwordHash")
          VALUES ('phase6-audit-user','Phase 6 Audit','phase6-audit@example.invalid','audit-hash');

          INSERT INTO "MembershipPlan" ("id","name","code","price","durationDays","isActive","createdAt","updatedAt")
          VALUES ('phase6-audit-plan','Audit Premium','PREMIUM','99.00',30,true,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP)
          ON CONFLICT ("code") DO NOTHING;

          SELECT "id","email","createdAt" FROM "User" WHERE "id"='phase6-audit-user';
          SELECT "code","price" FROM "MembershipPlan" WHERE "code"='PREMIUM';
          SQL

      - name: Re-check migration state after data compatibility smoke test
        run: npx prisma migrate status

  unit-tests:
    name: Unit Test — ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - src/app.controller.spec.ts
          - src/mail/mail.service.spec.ts
          - src/modules/auth/auth.controller.spec.ts
          - src/modules/auth/auth.refresh-token-security.spec.ts
          - src/modules/auth/auth.service.spec.ts
          - test/jwt-secret.service.spec.ts
          - src/modules/favorites/favorites.service.spec.ts
          - src/modules/properties/properties.service.spec.ts
          - src/modules/properties/property-lifecycle.spec.ts
          - src/modules/properties/property-security.spec.ts
          - src/modules/property-images/property-images.service.spec.ts
          - src/modules/social-media/social-media.service.spec.ts
          - src/modules/users/users.controller.spec.ts
          - src/modules/users/users.service.spec.ts
          - src/storage/storage.service.spec.ts
          - test/payments-reconciliation.spec.ts
          - test/payments-security.spec.ts
          - test/money-data-model.spec.ts

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run unit test file
        run: npx jest --config ./test/jest-unit.json --runInBand "${{ matrix.test_file }}"
