name: Flutter Fast Check

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "mobile_app/**"
      - ".github/workflows/flutter_fast_check.yml"
    branches-ignore:
      - main
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/flutter_fast_check.yml"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Run focused Flutter unit/widget tests
        shell: bash
        run: |
          mapfile -t TEST_FILES < <(find test -type f -name '*_test.dart' -not -path 'test/integration/*' | sort)
          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            flutter test --no-pub "${TEST_FILES[@]}"
          else
            echo "No focused/unit Flutter tests found; skipping test step."
          fi
      - name: Compile debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          test -n "$MAPS_API_KEY"
          test -n "$E2E_BASE_URL"
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "E2E_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          flutter build apk --debug --dart-define=API_BASE_URL=$E2E_BASE_URL/api/v1
