name: Deploy RentItEase Web to Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Flutter Web (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Build Flutter Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${API_BASE_URL:?Set API_BASE_URL in the selected GitHub environment}"
          cd mobile_app
          flutter pub get
          flutter build web --release --dart-define="API_BASE_URL=${API_BASE_URL}"

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in the selected GitHub environment}"
          npm install --global firebase-tools
          firebase deploy --only hosting \
            --project "${FIREBASE_PROJECT_ID}" \
            --non-interactive
