name: Dependency and Security Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/web-admin-panel-hash-route]

permissions:
  contents: read

jobs:
  backend:
    name: Backend npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report
        run: npm audit --audit-level=high

  admin:
    name: Admin npm audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  flutter:
    name: Flutter dependency review
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub outdated
      - run: flutter analyze
