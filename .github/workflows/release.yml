name: Publish Android APK to GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.0)"
        required: true
        default: "v1.0.1"
        type: string
      release_name:
        description: "Release title"
        required: true
        default: "RentItEase v1.0.1"
        type: string
      build_number:
        description: "Android version code (increase for every new release)"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record release source
        run: |
          echo "RENTITEASE_RELEASE_SHA=$GITHUB_SHA"
          echo "$GITHUB_SHA" > RELEASE_COMMIT.txt

      - name: Validate build number
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "build_number must contain only digits."
              exit 1
              ;;
          esac
          if [ "$BUILD_NUMBER" -lt 1 ]; then
            echo "build_number must be at least 1."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          test -n "$API_BASE_URL"
          flutter build apk \
            --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENABLE_GOOGLE_SIGN_IN=true \
            --dart-define=ENABLE_PHONE_OTP=false

          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/RentItEase-release.apk

      - name: Verify release APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/RentItEase-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: mobile_app/build/app/outputs/flutter-apk/RentItEase-release.apk
          fail_on_unmatched_files: true
          body: |
            Android release built from commit `${{ github.sha }}`.
            Production API is supplied by the `API_BASE_URL` release secret.
