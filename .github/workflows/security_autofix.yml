name: One-time backend audit fix
# Re-run after direct dependency cleanup.

on:
  push:
    branches: [fix/web-admin-panel-hash-route]
    paths:
      - ".github/workflows/security_autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[audit-fix]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm audit fix
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report
        run: npm audit --audit-level=high || true
      - name: Commit safe audit fixes
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No dependency changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "security: apply npm audit fixes [audit-fix]"
          git push
