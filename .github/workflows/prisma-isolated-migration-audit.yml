name: RentItEase - Isolated Prisma Migration Audit

on:
  push:
    branches:
      - rentitease-pr92-e2e
    paths:
      - '.github/workflows/prisma-isolated-migration-audit.yml'
      - 'backend/prisma/**'
      - 'backend/scripts/audit-prisma-migrations.ts'
      - 'backend/package.json'
      - 'backend/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentitease-isolated-prisma-migration-audit
  cancel-in-progress: false

jobs:
  migration-audit:
    name: Apply migrations to isolated Neon test branch (public schema)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
      SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}

    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@v4
        with:
          ref: rentitease-pr92-e2e

      - name: Validate and normalize isolated database targets without printing credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function validate(name) {
            const raw = process.env[name];
            if (!raw) throw new Error('Missing required GitHub Actions secret: ' + name);
            let url;
            try { url = new URL(raw); } catch { throw new Error(name + ' is not a valid PostgreSQL URL.'); }
            if (!['postgres:', 'postgresql:'].includes(url.protocol)) {
              throw new Error(name + ' must use PostgreSQL.');
            }
            if (!url.hostname || !url.pathname || url.pathname === '/') {
              throw new Error(name + ' must include a database name.');
            }
            if (['api.rentitease.com', 'rentitease.com', 'www.rentitease.com'].includes(url.hostname.toLowerCase())) {
              throw new Error('Refusing production host for ' + name + '.');
            }
            const suppliedSchema = url.searchParams.get('schema');
            if (suppliedSchema && !['public', 'rentitease_migration_test'].includes(suppliedSchema)) {
              throw new Error(name + ' has an unexpected schema parameter.');
            }
            // Historical migrations explicitly inspect/modify public. Normalize only
            // these disposable Neon branch URLs so the audit matches migration SQL.
            url.searchParams.set('schema', 'public');
            fs.appendFileSync(process.env.GITHUB_ENV, name + '=' + url.toString() + '\n');
            return { host: url.hostname, database: url.pathname, schema: 'public' };
          }
          const test = validate('MIGRATION_TEST_DATABASE_URL');
          const shadow = validate('SHADOW_DATABASE_URL');
          if (test.host !== shadow.host || test.database !== shadow.database) {
            console.log('Test and shadow URLs use distinct database targets; host/database differ.');
          } else {
            console.log('Test and shadow URLs both target schema=public on isolated Neon branches.');
          }
          console.log('Database target validation passed; credentials and full URLs are not logged.');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # This workflow exclusively targets the validated, disposable Neon test branch and its public schema.
      # Reset that isolated branch schema first so a previous failed migration record (P3009)
      # cannot block a clean replay. Never point this secret at production.
      - name: Reset only the isolated migration branch public schema
        env:
          DATABASE_URL: ${{ env.MIGRATION_TEST_DATABASE_URL }}
        run: npx prisma migrate reset --force --schema prisma/schema.prisma

      - name: Run static audit and verify complete migration chain
        run: npx ts-node scripts/audit-prisma-migrations.ts
