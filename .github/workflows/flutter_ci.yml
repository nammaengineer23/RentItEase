name: Flutter Fast Check

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Flutter analyze and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test

      # Compile the staging flavor in PR CI so Android Gradle, Firebase
      # google-services.json selection, and staging package identity are checked.
      - name: Build staging Android debug APK
        run: |
          flutter build apk --flavor staging --debug \
            --dart-define=STAGING=true \
            --dart-define=API_BASE_URL=https://rentitease-staging-api-production.up.railway.app/api/v1
          test -f build/app/outputs/flutter-apk/app-staging-debug.apk
