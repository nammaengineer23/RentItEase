name: Admin Panel CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin:
    name: Admin lint/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_panel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_panel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Security client tests
        run: npx --yes vitest@3.2.4 run src/api/http.test.ts
      - name: Production build
        run: npm run build
