name: RentItEase - Isolated E2E (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test (must contain this workflow and E2E tests)
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: rentitease-isolated-staging-e2e
  cancel-in-progress: false

jobs:
  staging-e2e:
    name: Isolated Neon E2E (temporary API on GitHub runner)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.STAGING_E2E_DIRECT_DATABASE_URL }}
      E2E_DATABASE_URL: ${{ secrets.STAGING_E2E_DIRECT_DATABASE_URL }}
      E2E_ALLOWED_DATABASE_HOST: ${{ secrets.STAGING_E2E_ALLOWED_DIRECT_DATABASE_HOST }}
      E2E_CONFIRMED_NEON_BRANCH: rentitease-e2e-fresh
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_PREFIX: /api/v1
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_OTHER_OWNER_EMAIL: ${{ secrets.E2E_OTHER_OWNER_EMAIL }}
      E2E_OTHER_OWNER_PASSWORD: ${{ secrets.E2E_OTHER_OWNER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.STAGING_E2E_RAZORPAY_WEBHOOK_SECRET }}
      E2E_STRICT: "true"
      E2E_EXPECT_MARKETPLACE_ENABLED: "true"
      PROPERTY_MARKETPLACE_ENABLED: "true"
      E2E_MARKETPLACE_READ_ONLY: "false"
      E2E_RUN_ID: ${{ github.run_id }}
      NODE_ENV: test
      PORT: "3000"
      FIREBASE_PROJECT_ID: rentitease-staging
      FIREBASE_STORAGE_BUCKET: rentitease-staging.firebasestorage.app
      RAZORPAY_KEY_ID: ${{ secrets.STAGING_E2E_RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.STAGING_E2E_RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.STAGING_E2E_RAZORPAY_WEBHOOK_SECRET }}
      SOCIAL_AUTOMATION_MODE: DISABLED
      SOCIAL_SCHEDULER_ENABLED: "false"

    steps:
      - name: Checkout PR branch under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Authenticate to staging Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/722173159384/locations/global/workloadIdentityPools/rentitease-github/providers/rentitease-github-actions
          service_account: rentitease-staging-e2e@rentitease-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate isolated Neon target and required secrets
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            'DATABASE_URL', 'E2E_ALLOWED_DATABASE_HOST',
            'E2E_TENANT_EMAIL', 'E2E_TENANT_PASSWORD',
            'E2E_OWNER_EMAIL', 'E2E_OWNER_PASSWORD',
            'E2E_OTHER_OWNER_EMAIL', 'E2E_OTHER_OWNER_PASSWORD',
            'E2E_ADMIN_EMAIL', 'E2E_ADMIN_PASSWORD',
            'FIREBASE_PROJECT_ID', 'FIREBASE_STORAGE_BUCKET',
            'RAZORPAY_KEY_ID', 'RAZORPAY_KEY_SECRET', 'RAZORPAY_WEBHOOK_SECRET',
          ];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) throw new Error('Missing required GitHub Actions secrets: ' + missing.join(', '));

          if (process.env.FIREBASE_PROJECT_ID !== 'rentitease-staging') {
            throw new Error('Refusing Firebase project other than rentitease-staging.');
          }
          if (process.env.FIREBASE_STORAGE_BUCKET !== 'rentitease-staging.firebasestorage.app') {
            throw new Error('Refusing Firebase Storage bucket other than the staging bucket.');
          }
          if (process.env.PROPERTY_MARKETPLACE_ENABLED !== 'true') {
            throw new Error('Marketplace E2E requires PROPERTY_MARKETPLACE_ENABLED=true.');
          }
          if (process.env.E2E_CONFIRMED_NEON_BRANCH !== 'rentitease-e2e-fresh') {
            throw new Error('Refusing to continue: confirmed Neon branch must be rentitease-e2e-fresh.');
          }
          const url = new URL(process.env.DATABASE_URL);
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) throw new Error('E2E database URL must use PostgreSQL.');
          if (!url.hostname.toLowerCase().endsWith('.neon.tech')) throw new Error('Refusing non-Neon database host.');
          if (url.hostname.toLowerCase() !== process.env.E2E_ALLOWED_DATABASE_HOST.toLowerCase()) {
            throw new Error('Refusing database host that does not match STAGING_E2E_ALLOWED_DIRECT_DATABASE_HOST.');
          }
          if (url.pathname.replace(/^\//, '') !== 'neondb') throw new Error('Refusing database other than neondb.');
          if (['api.rentitease.com', 'rentitease.com', 'www.rentitease.com'].includes(url.hostname.toLowerCase())) {
            throw new Error('Refusing production database host.');
          }
          if (!process.env.RAZORPAY_KEY_ID.startsWith('rzp_test_')) {
            throw new Error('Only a Razorpay TEST key (rzp_test_...) is allowed in isolated E2E.');
          }

          const expected = {
            E2E_TENANT_EMAIL: 'tenant.test@rentitease.com',
            E2E_OWNER_EMAIL: 'owner.test@rentitease.com',
            E2E_OTHER_OWNER_EMAIL: 'testother.owner@rentitease.com',
            E2E_ADMIN_EMAIL: 'admin@rentitease.com',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (process.env[key].toLowerCase() !== value) throw new Error(key + ' does not match the approved isolated E2E account.');
          }
          console.log('PASS: database host, database name, Neon branch confirmation, account identities and Razorpay TEST key validated. No credential values were logged.');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to the allowlisted isolated Neon database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Verify the four isolated E2E accounts
        run: npx ts-node scripts/seed-isolated-e2e-users.ts

      - name: Build temporary API
        run: |
          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const envFile = process.env.GITHUB_ENV;
          fs.appendFileSync(envFile, `JWT_ACCESS_SECRET=${process.env.JWT_ACCESS_SECRET}\nJWT_REFRESH_SECRET=${process.env.JWT_REFRESH_SECRET}\n`, { mode: 0o600 });
          NODE

      - name: Start temporary API on the GitHub runner
        shell: bash
        run: |
          nohup node dist/main > /tmp/rentitease-e2e-api.log 2>&1 &
          echo $! > /tmp/rentitease-e2e-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then
              echo "Temporary API health check passed."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/rentitease-e2e-api.pid)" 2>/dev/null; then
              echo "Temporary API process exited unexpectedly."
              tail -n 100 /tmp/rentitease-e2e-api.log
              exit 1
            fi
            sleep 2
          done
          echo "Temporary API did not become healthy."
          tail -n 100 /tmp/rentitease-e2e-api.log
          exit 1

      - name: Marketplace E2E (SALE, LEASE, SITE_SALE, SITE_RENT, SITE_LEASE, enquiries, IDOR)
        run: npx jest --config test/jest-release-e2e.json --runInBand --verbose test/release/marketplace.e2e-spec.ts

      - name: Rental property regression
        run: npx jest --config test/jest-release-e2e.json --runInBand --verbose test/release/property.e2e-spec.ts

      - name: Booking regression
        run: npx jest --config test/jest-release-e2e.json --runInBand --verbose test/release/booking.e2e-spec.ts

      - name: Payment regression (Razorpay TEST credentials + signed webhook simulation)
        run: npx jest --config test/jest-release-e2e.json --runInBand --verbose test/release/payment.e2e-spec.ts

      - name: Lease lifecycle regression
        run: npx jest --config test/jest-release-e2e.json --runInBand --verbose test/release/lease-lifecycle.e2e-spec.ts

      - name: Stop temporary API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rentitease-e2e-api.pid ]; then
            kill "$(cat /tmp/rentitease-e2e-api.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/rentitease-e2e-api.log ]; then
            tail -n 80 /tmp/rentitease-e2e-api.log
          fi
