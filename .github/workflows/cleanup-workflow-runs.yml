name: Retain Recent GitHub Actions Runs

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: Number of newest workflow runs to retain
        required: true
        default: '100'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep newest workflow runs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_LATEST: ${{ inputs.keep_latest }}

    steps:
      - name: Delete workflow runs older than the retention limit
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$KEEP_LATEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_latest must be a positive whole number."
            exit 1
          fi

          mapfile -t run_ids < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | "\(.created_at)\t\(.id)"' \
              | sort -r \
              | cut -f2
          )

          total_runs=${#run_ids[@]}
          echo "Found ${total_runs} workflow runs. Retaining the newest ${KEEP_LATEST}."

          if (( total_runs <= KEEP_LATEST )); then
            echo "Nothing to delete."
            exit 0
          fi

          deleted=0
          for run_id in "${run_ids[@]:KEEP_LATEST}"; do
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done

          echo "Deleted ${deleted} old workflow runs."
