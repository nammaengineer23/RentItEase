name: Retain Recent GitHub Actions Runs

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      keep_latest:
        description: Number of newest workflow runs to retain
        required: false
        default: '100'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: rentitease-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep newest workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_LATEST: ${{ inputs.keep_latest || '100' }}

    steps:
      - name: Delete workflow runs older than the retention limit
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$KEEP_LATEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_latest must be a positive whole number."
            exit 1
          fi

          mapfile -t run_ids < <(
            gh api --paginate               "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"               --jq '.workflow_runs[] | "(.created_at)	(.id)"'               | sort -r               | cut -f2
          )

          total_runs=${#run_ids[@]}
          echo "Found ${total_runs} workflow runs. Retaining the newest ${KEEP_LATEST}."

          if (( total_runs <= KEEP_LATEST )); then
            echo "Nothing to delete."
            exit 0
          fi

          deleted=0
          failures=0

          for run_id in "${run_ids[@]:KEEP_LATEST}"; do
            if gh api --method DELETE --retry 5 --retry-all-errors --retry-delay 2               "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failures=$((failures + 1))
              echo "::warning::Failed to delete workflow run ${run_id} after retries."
            fi
          done

          echo "Deleted ${deleted} old workflow runs."
          echo "Deletion failures: ${failures}"

          if (( failures > 0 )); then
            exit 1
          fi
