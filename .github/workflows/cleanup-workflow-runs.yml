name: Retain Recent GitHub Actions Runs

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      keep_latest:
        description: Number of newest workflow runs to retain
        required: false
        default: '100'
        type: string
  push:
    branches:
      - fix/cleanup-workflow-runs
    paths:
      - .github/workflows/cleanup-workflow-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: rentitease-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep newest workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_LATEST: ${{ inputs.keep_latest || '100' }}
      MAX_DELETE_PER_RUN: '100'

    steps:
      - name: Delete workflow runs older than the retention limit
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$KEEP_LATEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_latest must be a positive whole number."
            exit 1
          fi

          total_runs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1&page=1" --jq '.total_count')
          echo "Found ${total_runs} workflow runs. Retaining the newest ${KEEP_LATEST}."

          if (( total_runs <= KEEP_LATEST )); then
            echo "Nothing to delete."
            exit 0
          fi

          # GitHub returns workflow runs newest-first by default. Fetch only page 2:
          # page 1 is the 100 newest runs, so page 2 contains the next 100 candidates.
          # Avoid paginating thousands of historical runs on every cleanup execution.
          mapfile -t old_run_ids < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=2" \
              --jq '.workflow_runs[].id'
          )

          old_run_count=${#old_run_ids[@]}
          delete_count=$old_run_count
          if (( delete_count > MAX_DELETE_PER_RUN )); then
            delete_count=$MAX_DELETE_PER_RUN
          fi

          echo "Eligible old runs: ${old_run_count}. This run will delete at most ${delete_count}."

          deleted=0
          failures=0

          for run_id in "${old_run_ids[@]:0:delete_count}"; do
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              failures=$((failures + 1))
              echo "::warning::Skipping invalid workflow run ID: ${run_id}"
              continue
            fi

            success=false
            for attempt in 1 2 3 4 5; do
              if gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null; then
                success=true
                break
              fi
              echo "::warning::Delete attempt ${attempt} failed for workflow run ${run_id}."
              sleep $((attempt * 2))
            done

            if [[ "$success" == true ]]; then
              deleted=$((deleted + 1))
            else
              failures=$((failures + 1))
              echo "::warning::Failed to delete workflow run ${run_id} after 5 attempts."
            fi
          done

          remaining=$((old_run_count - deleted))
          echo "Deleted ${deleted} old workflow runs."
          echo "Old runs remaining beyond retention: approximately ${remaining}."
          echo "Deletion failures: ${failures}"

          if (( failures > 0 )); then
            exit 1
          fi
