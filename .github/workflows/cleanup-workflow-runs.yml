name: Retain Recent GitHub Actions Runs

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      keep_latest:
        description: Number of newest workflow runs to retain
        required: false
        default: '100'
        type: string
  push:
    branches:
      - fix/cleanup-workflow-runs
    paths:
      - .github/workflows/cleanup-workflow-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: rentitease-workflow-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep newest workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_LATEST: ${{ inputs.keep_latest || '100' }}
      MAX_DELETE_PER_RUN: '100'

    steps:
      - name: Validate and optionally delete old workflow runs
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$KEEP_LATEST" =~ ^[1-9][0-9]*$ ]]; then
            echo "keep_latest must be a positive whole number."
            exit 1
          fi

          per_page=100
          page=$(( KEEP_LATEST / per_page + 1 ))
          skip=$(( KEEP_LATEST % per_page ))

          total_runs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1&page=1" --jq '.total_count')
          echo "Found ${total_runs} workflow runs. Retaining the newest ${KEEP_LATEST}."

          if (( total_runs <= KEEP_LATEST )); then
            echo "Nothing to delete."
            exit 0
          fi

          # Fetch only the page containing the first run beyond the retention limit.
          # The API is newest-first; skip the retained entries on that page.
          mapfile -t old_run_ids < <(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=${per_page}&page=${page}" \
              --jq '.workflow_runs[].id' | tail -n +$((skip + 1))
          )

          old_run_count=${#old_run_ids[@]}
          delete_count=$old_run_count
          if (( delete_count > MAX_DELETE_PER_RUN )); then
            delete_count=$MAX_DELETE_PER_RUN
          fi

          echo "Eligible old runs on this page: ${old_run_count}. Maximum deletions: ${delete_count}."

          # Pushes to the maintenance branch validate the script without deleting
          # historical runs. Actual cleanup runs only on schedule or manual dispatch.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Push validation only: no workflow runs will be deleted."
            exit 0
          fi

          deleted=0
          failures=0

          for run_id in "${old_run_ids[@]:0:delete_count}"; do
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              failures=$((failures + 1))
              echo "::warning::Skipping invalid workflow run ID: ${run_id}"
              continue
            fi

            success=false
            for attempt in 1 2 3 4 5 6; do
              if gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null; then
                success=true
                break
              fi

              echo "::warning::Delete attempt ${attempt} failed for workflow run ${run_id}."
              delay=$(( 2 ** attempt ))
              if (( delay > 30 )); then
                delay=30
              fi
              sleep "$delay"
            done

            if [[ "$success" == true ]]; then
              deleted=$((deleted + 1))
              # Reduce request bursts against the GitHub Actions API.
              sleep 1
            else
              failures=$((failures + 1))
              echo "::warning::Failed to delete workflow run ${run_id} after 6 attempts."
            fi
          done

          remaining=$((old_run_count - deleted))
          echo "Deleted ${deleted} old workflow runs."
          echo "Old runs remaining on this page: approximately ${remaining}."
          echo "Deletion failures: ${failures}"

          if (( failures > 0 )); then
            exit 1
          fi
