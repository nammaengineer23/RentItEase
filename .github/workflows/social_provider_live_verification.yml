name: Social provider live verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SOCIAL_LIVE_DATABASE_URL }}
      SOCIAL_ACCOUNT_ENCRYPTION_KEY: ${{ secrets.SOCIAL_ACCOUNT_ENCRYPTION_KEY }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_AMBIGUOUS_EXTERNAL_ID: ${{ secrets.INSTAGRAM_AMBIGUOUS_EXTERNAL_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_AMBIGUOUS_EXTERNAL_ID: ${{ secrets.FACEBOOK_AMBIGUOUS_EXTERNAL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
      YOUTUBE_AMBIGUOUS_EXTERNAL_ID: ${{ secrets.YOUTUBE_AMBIGUOUS_EXTERNAL_ID }}
      SOCIAL_VERIFY_REFRESH: 'true'
      SOCIAL_LIVE_TEST_POST_ID: ${{ secrets.SOCIAL_LIVE_TEST_POST_ID }}
      SOCIAL_CONCURRENCY_WORKERS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx ts-node scripts/social-provider-live-verification.ts
