name: mobile_app
description: Production-ready RentEase mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_auth: ^5.1.0
  firebase_core: ^3.13.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  google_sign_in: ^6.1.0
  shared_preferences: ^2.5.5
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_polyline_points: ^3.1.0
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  flutter_google_places_sdk: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/