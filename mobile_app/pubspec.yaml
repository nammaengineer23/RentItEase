name: mobile_app
description: Production-ready RentItEase mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_polyline_points: ^3.1.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  mime: ^2.0.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  razorpay_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
