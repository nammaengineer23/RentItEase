org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

# These flags were added by the Flutter template
android.newDsl=false
android.builtInKotlin=false

# Use R8's optimized code/resource shrinking pipeline with AGP 8.12.1.
# Release builds must be regression-tested for Google Sign-In and Razorpay.
android.r8.optimizedResourceShrinking=true

# Reduce memory pressure and improve build stability
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.caching=true
