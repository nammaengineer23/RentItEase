org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

# These flags were added by the Flutter template
android.newDsl=false
android.builtInKotlin=false

# Keep the stable R8 shrinking pipeline. The optimized resource-shrinking
# path in AGP 8.12.1 crashes in minifyReleaseWithR8 in CI with
# StringIndexOutOfBoundsException; re-enable only after validating an upgrade.
android.r8.optimizedResourceShrinking=false

# Reduce memory pressure and improve build stability
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.caching=true
