        stroke="#082B66"
        stroke-width="28"
        stroke-linecap="round"/>
  <path d="M357 195 V290"
        fill="none"
        stroke="#082B66"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Window -->
  <rect x="224" y="170" width="27" height="27" rx="2" fill="#082B66"/>
  <rect x="261" y="170" width="27" height="27" rx="2" fill="#082B66"/>
  <rect x="224" y="207" width="27" height="27" rx="2" fill="#082B66"/>
  <rect x="261" y="207" width="27" height="27" rx="2" fill="#082B66"/>

  <!-- Leaf -->
  <path d="M211 308
